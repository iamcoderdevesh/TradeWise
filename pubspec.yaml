name: tradewise
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: google_fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: google_fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: google_fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: google_fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: google_fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: google_fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: google_fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: google_fonts/Inter_18pt-Black.ttf
          weight: 900
